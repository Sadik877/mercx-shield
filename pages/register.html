<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MercX Register</title>

  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="container">

    <div class="left">

      <div class="overlay"></div>

      <div class="content">
        <h1>Join MercX</h1>

        <p>
          Create account and start shipping instantly.
        </p>
      </div>

    </div>

    <div class="right">

      <form class="form">

        <h2>Create Account</h2>

        <p class="sub">
          Register as client or driver
        </p>

        <div class="input-group">
          <label>Full Name</label>

          <input type="text" placeholder="Enter full name">
        </div>

        <div class="input-group">
          <label>Email</label>

          <input type="email" placeholder="Enter email">
        </div>

        <div class="input-group">
          <label>Phone Number</label>

          <input type="text" placeholder="+234...">
        </div>

        <div class="input-group">
          <label>Account Type</label>

          <select>
            <option>Client</option>
            <option>Driver</option>
          </select>
        </div>

        <div class="input-group">
          <label>Password</label>

          <div class="password-box">
            <input type="password" id="registerPassword" placeholder="Enter password">

            <button type="button" onclick="toggleRegisterPassword()">
              👁
            </button>
          </div>
        </div>

        <button class="submit-btn">
          Create Account
        </button>

        <p class="switch">
          Already have account?
          <a href="login.html">Login</a>
        </p>

      </form>

    </div>

  </div>

  <script src="auth.js"></script>

</body>
</html>
