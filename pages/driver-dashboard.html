<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Dashboard</title>

  <link rel="stylesheet" href="../css/auth.css">

  <style>

    .dashboard{
      width:100%;
      max-width:1200px;
      margin:auto;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-top:30px;
    }

    .card{
      background:#111827;
      padding:30px;
      border-radius:24px;
    }

  </style>
</head>
<body>

  <div class="dashboard">

    <h1>Driver Dashboard</h1>

    <div class="cards">

      <div class="card">
        <h2>₦45,000</h2>
        <p>Today's Earnings</p>
      </div>

      <div class="card">
        <h2>18</h2>
        <p>Completed Deliveries</p>
      </div>

      <div class="card">
        <h2>4.9 ★</h2>
        <p>Driver Rating</p>
      </div>

    </div>

  </div>

</body>
</html>
